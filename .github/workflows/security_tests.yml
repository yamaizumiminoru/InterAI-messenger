name: Local API security tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt pytest httpx
      - run: python -m pytest -q backend/tests/test_api_security.py
        env:
          PYTHONPATH: backend
